<!--
==============================================================================
  Begehungsmappe – Offline-App für Arbeitssicherheits- und Brandschutzbegehungen
==============================================================================
  Version:   1.0.0
  Datum:     2026-10-28
  Plattform: Android-Tablet (Chrome), als PWA installierbar, komplett offline

  ZWECK
  -----
  Erfassung von Begehungen vor Ort: Ordner frei benennbar (z. B. pro Kunde),
  darin beliebig viele Begehungen. Jede Begehung ist ein fortlaufendes
  Protokoll aus Blöcken: Fotos, Handschrift (S-Pen) und getipptem Text.
  Fotos landen an der Einfügemarke im Fluss, die zugehörige Notiz folgt
  direkt danach.

  FUNKTIONEN
  ----------
  - Ordner anlegen, umbenennen, löschen
  - Begehungen mit Titel, Datum, Art (Arbeitssicherheit / Brandschutz /
    beides), Objekt/Standort, Teilnehmende, Bemerkung
  - Handschrift-Blöcke: S-Pen schreibt, Finger scrollt (Handballen-
    Erkennung); optional "Finger zeichnet"; Druckstärke, 3 Farben,
    2 Strichstärken, Radierer, Rückgängig, Fläche wächst automatisch
  - Text-Blöcke für Bildschirmtastatur
  - Fotos per Kamera oder aus der Galerie, automatisch verkleinert
    (max. 1600 px, JPEG) und im Gerät gespeichert
  - Einfügemarke zwischen beliebigen Blöcken, Blöcke verschieben/löschen
  - Mängel-Markierung je Block (Priorität hoch / mittel / gering)
  - Berichtsansicht mit Mängelübersicht, Drucken / als PDF speichern
  - Datensicherung: Export/Import als JSON (inkl. Fotos), Teilen über
    das Android-Teilen-Menü
  - Speicherung in IndexedDB, Bitte um dauerhaften Speicher
  - Bildschirm bleibt im Editor an (Wake Lock, falls erlaubt)

  CHANGELOG
  ---------
  1.0.0 (2026-10-28)  Erste Version: Ordner, Begehungen, Editor mit Foto/
                      Handschrift/Text im Fluss, Mängel-Priorität, Bericht,
                      Sicherung, Offline-Betrieb über Service Worker.

  GEPLANT (Version 2)
  -------------------
  - KI-Auswertung der Notizen (Handschrift → Text → Bericht)
  - Ausgabe auf definiertes Formblatt, Versand per Mail
==============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: tabletbreites Protokollblatt in der Mitte, feste Werkzeugleiste unten, Kopfleiste oben. */
:root {
  --bg: #E9EEEB;
  --surface: #FFFFFF;
  --surface-2: #F4F7F5;
  --ink: #17221D;
  --muted: #56645D;
  --line: #CCD6D0;
  --accent: #0B6B43;       /* Rettungszeichen-Grün */
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EBE1;
  --fire: #B5121B;         /* Brandschutzzeichen-Rot */
  --fire-soft: #F6DADB;
  --warn: #B87800;
  --warn-soft: #F7E8C6;
  --low: #3C6E91;
  --low-soft: #DCE8F1;
  --paper: #FCFDFB;
  --paper-grid: #DCE5E0;
  --dock: #1E2A24;
  --dock-ink: #E8EEEA;
  --dock-muted: #9FB0A7;
  --shadow: 0 1px 2px rgba(20,35,28,.08), 0 4px 14px rgba(20,35,28,.06);
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", Roboto, "Segoe UI", system-ui, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101613; --surface: #18201C; --surface-2: #1F2924; --ink: #E4EBE7; --muted: #9AA9A1; --line: #2F3B35;
    --accent: #2FAE73; --accent-ink: #08130D; --accent-soft: #173327; --fire: #FF6A72; --fire-soft: #3A1C1E;
    --warn: #F0B53A; --warn-soft: #3A2F15; --low: #7DB3DA; --low-soft: #1B2B38;
    --paper: #F1F4F2; --paper-grid: #D3DCD7; --dock: #0B100D; --dock-ink: #E4EBE7; --dock-muted: #8A9A92;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101613; --surface: #18201C; --surface-2: #1F2924; --ink: #E4EBE7; --muted: #9AA9A1; --line: #2F3B35;
  --accent: #2FAE73; --accent-ink: #08130D; --accent-soft: #173327; --fire: #FF6A72; --fire-soft: #3A1C1E;
  --warn: #F0B53A; --warn-soft: #3A2F15; --low: #7DB3DA; --low-soft: #1B2B38;
  --paper: #F1F4F2; --paper-grid: #D3DCD7; --dock: #0B100D; --dock-ink: #E4EBE7; --dock-muted: #8A9A92;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 16px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; line-height: 1.15; margin: 0; text-wrap: balance; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Kopfleiste */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px;
  min-height: 60px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .spacer { flex: 1; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; }
.brand-mark { width: 28px; height: 28px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 18px; height: 18px; stroke-width: 2.2; }
.crumb { display: flex; flex-direction: column; min-width: 0; }
.crumb small { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.crumb strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink);
  font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--fire); border-color: var(--fire); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.icon { width: 44px; padding: 0; justify-content: center; }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: .92rem; }
.btn.icon.sm { width: 36px; }

.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h1 { font-size: 2rem; }
.section-head p { margin: 2px 0 0; color: var(--muted); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); color: var(--ink);
}
textarea.input { min-height: 80px; resize: vertical; }
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; }
.inline-form .input { flex: 1 1 260px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* Ordner */
.folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.folder {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
}
.folder::before { content: ""; position: absolute; left: 14px; top: -7px; width: 64px; height: 8px; border-radius: 4px 4px 0 0; background: var(--accent); }
.folder-open { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.folder-open:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.folder h2 { font-size: 1.35rem; overflow-wrap: anywhere; }
.folder .meta { color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }
.folder .actions { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }

/* Begehungsliste */
.list { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.row-main { all: unset; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-main:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.row h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
.row .meta { color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .row { grid-template-columns: auto 1fr; } .row-actions { grid-column: 1 / -1; justify-content: flex-start; } }

/* Art-Zeichen nach Vorbild der Sicherheitszeichen */
.sign { width: 46px; height: 46px; border-radius: 4px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: #fff; letter-spacing: .04em; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.sign.as { background: #0B6B43; }
.sign.bs { background: #B5121B; }
.sign.kombi { background: linear-gradient(135deg, #0B6B43 0 50%, #B5121B 50% 100%); }
.sign.sm { width: 30px; height: 30px; font-size: .72rem; border-width: 1.5px; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 15px; font-size: .85rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
.chip.hoch { background: var(--fire-soft); color: var(--fire); border-color: transparent; }
.chip.mittel { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.gering { background: var(--low-soft); color: var(--low); border-color: transparent; }

.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 28px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--ink); font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }

details.backup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.backup summary { padding: 14px 16px; cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 10px; }
details.backup summary::-webkit-details-marker { display: none; }
details.backup .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; color: var(--muted); }
details.backup .body .inline-form { align-items: center; }
.storage { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { color: var(--muted); font-size: .82rem; text-align: center; }

/* Editor */
.title-input { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: var(--r); background: transparent; padding: 6px 8px; font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; }
.title-input:hover, .title-input:focus { border-color: var(--line); background: var(--surface-2); }
.save-state { font-size: .8rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 640px) { .save-state, .hide-narrow { display: none; } }

.doc {
  max-width: 980px; margin: 0 auto;
  padding-block: 16px calc(150px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column;
}
.meta-panel { margin-bottom: 8px; }
.gap { all: unset; display: flex; align-items: center; gap: 10px; height: 26px; cursor: pointer; color: transparent; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.gap::before, .gap::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: transparent; }
.gap:hover, .gap:focus-visible { color: var(--muted); }
.gap:hover::before, .gap:hover::after { background: var(--line); }
.gap.on { color: var(--accent); height: 34px; }
.gap.on::before, .gap.on::after { background: var(--accent); }

.blk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.blk.prio-hoch { border-left: 5px solid var(--fire); }
.blk.prio-mittel { border-left: 5px solid var(--warn); }
.blk.prio-gering { border-left: 5px solid var(--low); }
.blk-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.blk-type { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.blk-type svg { width: 18px; height: 18px; }
.blk-num { font-variant-numeric: tabular-nums; color: var(--ink); }
.blk-head .spacer { flex: 1; }
.chip-btn { cursor: pointer; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--fire); font-weight: 600; }

.photo-body { background: #0E1411; display: flex; justify-content: center; }
.photo-body img { display: block; max-width: 100%; max-height: 72vh; object-fit: contain; }
.photo-missing { color: #9AA9A1; padding: 40px; }

.txt { display: block; width: 100%; border: 0; padding: 14px 16px; min-height: 96px; resize: none; background: var(--surface); color: var(--ink); font-size: 1.05rem; line-height: 1.55; overflow: hidden; }
.txt:focus { outline: none; background: var(--surface-2); }

.ink-wrap {
  position: relative; width: 100%;
  background-color: var(--paper);
  background-image: linear-gradient(var(--paper-grid) 1px, transparent 1px), linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.ink-wrap canvas { display: block; touch-action: none; }
.ink-foot { display: flex; justify-content: center; padding: 6px; border-top: 1px dashed var(--line); background: var(--surface-2); }
.blk.active-ink { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }

/* Werkzeugleiste */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--dock); color: var(--dock-ink);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock-inner {
  display: flex; gap: 18px; align-items: center; overflow-x: auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  scrollbar-width: none;
}
.dock-inner::-webkit-scrollbar { display: none; }
.dock-group { display: flex; gap: 6px; align-items: center; flex: none; }
.dock-group + .dock-group { padding-left: 18px; border-left: 1px solid #ffffff22; }
.dock-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dock-muted); writing-mode: vertical-rl; transform: rotate(180deg); }
.tool {
  all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 64px; height: 58px; padding: 0 8px; border-radius: var(--r); color: var(--dock-ink); font-size: .78rem; font-weight: 500;
}
.tool:hover { background: #ffffff14; }
.tool:focus-visible { outline: 3px solid var(--accent); }
.tool.on { background: #ffffff22; box-shadow: inset 0 -3px 0 var(--accent); }
.tool.big { background: var(--accent); color: var(--accent-ink); min-width: 78px; }
.tool.big:hover { filter: brightness(1.08); background: var(--accent); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; box-shadow: 0 0 0 1px #ffffff40; }
.swatch.on { border-color: var(--dock-ink); }
.dock select { background: #ffffff14; border: 1px solid #ffffff30; color: var(--dock-ink); border-radius: var(--r); min-height: 40px; padding: 0 8px; }
.dock select option { color: #17221D; }

/* Bericht */
.report { max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); padding: 32px clamp(18px, 4vw, 48px); display: flex; flex-direction: column; gap: 22px; }
.rep-head { display: flex; gap: 16px; align-items: flex-start; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
.rep-head h1 { font-size: 2rem; }
.rep-head .sub { color: var(--muted); }
.rep-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 24px; margin: 0; }
.rep-meta div { min-width: 0; }
.rep-meta dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.rep-meta dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.rep-sum { border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.rep-sum table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.rep-sum th, .rep-sum td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rep-sum th { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.rep-sum tr:last-child td { border-bottom: 0; }
.rep-blk { display: flex; flex-direction: column; gap: 8px; break-inside: avoid; }
.rep-blk-head { display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rep-blk img { max-width: 100%; border: 1px solid var(--line); border-radius: 3px; }
.rep-blk .ink-img { background: #FCFDFB; }
.rep-blk p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.rep-foot { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: .82rem; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 500; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: var(--r); padding: 10px 14px; font-size: .92rem; }

@media (prefers-reduced-motion: no-preference) {
  .blk.just-added { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(6px); box-shadow: 0 0 0 3px var(--accent-soft); } to { transform: none; } }
}

@media print {
  body::before, .bar, .dock, .no-print, .toast { display: none !important; }
  html, body { background: #fff; color: #000; }
  .wrap { padding: 0; max-width: none; }
  .report { border: 0; padding: 0; max-width: none; }
  .rep-blk img { max-height: 120mm; }
}
</style>
</head>

<script>
(() => {
'use strict';

/* ======================================================================
   Konfiguration
   ====================================================================== */
const APP_VERSION = '1.0.0';
const DB_NAME = 'begehungsmappe';
const DB_VER = 1;
const INK_LOGICAL_WIDTH = 1000;   // Handschrift wird in festen logischen Einheiten gespeichert (drehsicher)
const INK_DEFAULT_HEIGHT = 520;
const INK_GROW_STEP = 320;
const PHOTO_MAX_PX = 1600;
const PHOTO_QUALITY = 0.82;
const ART = {

/* ======================================================================
   Datenbank (IndexedDB, Fallback: Arbeitsspeicher)
   ====================================================================== */
let DB = null;
let dbVolatile = false;

function idbOpen() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('folders')) d.createObjectStore('folders', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('inspections')) d.createObjectStore('inspections', { keyPath: 'id' }).createIndex('folderId', 'folderId');
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const wrapReq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function initDB() {
  try {
    const db = await idbOpen();
    const os = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
    DB = {
      all: (s) => wrapReq(os(s).getAll()),
      get: (s, id) => wrapReq(os(s).get(id)),
      put: (s, v) => wrapReq(os(s, 'readwrite').put(v)),
      del: (s, id) => wrapReq(os(s, 'readwrite').delete(id)),
      byFolder: (fid) => wrapReq(os('inspections').index('folderId').getAll(fid))
    };
  } catch (e) {
    dbVolatile = true;
    const mem = { folders: new Map(), inspections: new Map(), media: new Map() };
    DB = {
      all: async (s) => Array.from(mem[s].values()),
      get: async (s, id) => mem[s].get(id),
      put: async (s, v) => { mem[s].set(v.id, v); },
      del: async (s, id) => { mem[s].delete(id); },
      byFolder: async (fid) => Array.from(mem.inspections.values()).filter(i => i.folderId === fid)
    };
  }
}

async function requestPersist() {
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* ignorieren */ }
}

function nav(view, params = {}, push = true) {
  leaveView();
  Object.assign(S, { confirmKey: null, renameId: null, showNewInsp: false, showMeta: false }, params);
  S.view = view;
  if (push) { try { history.pushState({ view, folderId: S.folderId, inspId: S.inspId }, ''); } catch (e) { /* ignorieren */ } }
  render(true);
}
window.addEventListener('popstate', (e) => {
  const st = e.state || { view: 'home' };
  leaveView();
  Object.assign(S, { confirmKey: null, renameId: null, showNewInsp: false, showMeta: false, folderId: st.folderId || null, inspId: st.inspId || null });
  S.view = st.view || 'home';
  render(true);
});

function leaveView() {
  flushSave();
  pads.forEach(p => p.destroy()); pads = []; activePad = null;
  urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache = new Map();
  if (wakeLock) { try { wakeLock.release(); } catch (e) { /* ignorieren */ } wakeLock = null; }
}

async function render(scrollTop = false) {
  const y = window.scrollY;
  try {
    if (S.view === 'home') await renderHome();
    else if (S.view === 'folder') await renderFolder();
    else if (S.view === 'editor') await renderEditor();
    else if (S.view === 'report') await renderReport();

    $('#app').innerHTML = `<main class="wrap"><div class="banner">Fehler beim Anzeigen: ${esc(err.message)}</div><button class="btn" data-act="home">Zur Startseite</button></main>`;

}

let saveTimer = null;
function touch() {
  if (!S.insp) return;
  S.insp.updated = Date.now(); S.dirty = true;
  setSaveState('Wird gespeichert …');
  clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 500);
}
async function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!S.insp || !S.dirty) return;
  S.dirty = false;
  try { await DB.put('inspections', S.insp); setSaveState('Gespeichert ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })); }
  catch (e) { S.dirty = true; setSaveState('Speichern fehlgeschlagen'); toast('Speichern fehlgeschlagen: ' + e.message, 5000); }
}
function setSaveState(t) { const el = $('#saveState'); if (el) el.textContent = t; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); else if (S.view === 'editor') acquireWakeLock(); });
window.addEventListener('pagehide', flushSave);

async function acquireWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* nicht erlaubt */ }
}

async function updateStorageInfo() {
  const el = $('#storageInfo'); if (!el) return;
  try {
    const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
    const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
    const mb = est ? (est.usage / 1048576).toFixed(1).replace('.', ',') : '?';
    el.textContent = `Belegt: ${mb} MB · Dauerhafter Speicher: ${persisted ? 'ja' : 'nicht bestätigt (App installieren hilft)'}`;
  } catch (e) { el.textContent = ''; }
}

async function compressImage(file) {
  let src, w, h;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); w = src.width; h = src.height; }
  catch (e) {
    src = await new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bildformat nicht lesbar')); }; im.src = u; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const sc = Math.min(1, PHOTO_MAX_PX / Math.max(w, h));
  const cw = Math.round(w * sc), chh = Math.round(h * sc);
  const c = document.createElement('canvas'); c.width = cw; c.height = chh;
  c.getContext('2d').drawImage(src, 0, 0, cw, chh);
  if (src.close) src.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', PHOTO_QUALITY));
  return { blob: blob || file, w: cw, h: chh };
}

/* ======================================================================
   Handschrift
   ====================================================================== */
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, ((a[2] ?? .5) + (b[2] ?? .5)) / 2];
const lw = (s, p) => s.w * (0.45 + Math.min(1, Math.max(0.05, p ?? .5)) * 1.1);

function drawSeg(ctx, s, i) {
  const pts = s.p; const a = pts[i - 1], b = pts[i];
  const m1 = i >= 2 ? mid(pts[i - 2], a) : a;
  const m2 = mid(a, b);
  ctx.lineWidth = lw(s, a[2]);
  ctx.beginPath(); ctx.moveTo(m1[0], m1[1]); ctx.quadraticCurveTo(a[0], a[1], m2[0], m2[1]); ctx.stroke();
}
function drawStroke(ctx, s) {
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = s.p; if (!pts.length) return;
  if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], lw(s, pts[0][2]) / 2, 0, Math.PI * 2); ctx.fill(); return; }
  for (let i = 1; i < pts.length; i++) drawSeg(ctx, s, i);
  const a = pts[pts.length - 2], b = pts[pts.length - 1], m = mid(a, b);
  ctx.lineWidth = lw(s, b[2]); ctx.beginPath(); ctx.moveTo(m[0], m[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}

class InkPad {
  constructor(block, wrap, card) {
    this.b = block; this.wrap = wrap; this.card = card;
    this.c = $('canvas', wrap); this.ctx = this.c.getContext('2d');
    this.hist = []; this.cur = null; this.pid = null; this.scrollPid = null; this.erasing = false;
    this.onDown = this.onDown.bind(this); this.onMove = this.onMove.bind(this); this.onUp = this.onUp.bind(this);
    this.c.addEventListener('pointerdown', this.onDown);
    this.c.addEventListener('pointermove', this.onMove);
    this.c.addEventListener('pointerup', this.onUp);
    this.c.addEventListener('pointercancel', this.onUp);
    this.c.addEventListener('contextmenu', e => e.preventDefault());
    this.ro = new ResizeObserver(() => this.layout()); this.ro.observe(wrap);
    this.layout();
  }
  destroy() { this.ro.disconnect(); }
  layout() {
    const cw = this.wrap.clientWidth; if (!cw) return;
    this.scale = cw / INK_LOGICAL_WIDTH;
    const ch = Math.round(this.b.h * this.scale);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.c.style.width = cw + 'px'; this.c.style.height = ch + 'px';
    this.c.width = Math.round(cw * dpr); this.c.height = Math.round(ch * dpr);
    this.ctx.setTransform(dpr * this.scale, 0, 0, dpr * this.scale, 0, 0);
    this.redraw();
  }
  redraw() {
    const ctx = this.ctx; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, this.c.width, this.c.height); ctx.restore();
    for (const s of this.b.strokes) drawStroke(ctx, s);
  }
  pos(e) { const r = this.c.getBoundingClientRect(); return [ +((e.clientX - r.left) / this.scale).toFixed(1), +((e.clientY - r.top) / this.scale).toFixed(1), +(e.pressure || 0.5).toFixed(2) ]; }
  snapshot() { this.hist.push(JSON.stringify(this.b.strokes)); if (this.hist.length > 30) this.hist.shift(); }
  undo() { if (!this.hist.length) { toast('Nichts zum Zurücknehmen'); return; } this.b.strokes = JSON.parse(this.hist.pop()); this.redraw(); touch(); }
  grow(by = INK_GROW_STEP) { this.b.h += by; this.layout(); touch(); }
  onDown(e) {
    const draws = e.pointerType === 'pen' || e.pointerType === 'mouse' || (e.pointerType === 'touch' && S.fingerDraws);
    if (e.pointerType === 'touch' && penActive) { e.preventDefault(); return; } // Handballen ignorieren
    if (!draws) { // Finger scrollt die Seite
      this.scrollPid = e.pointerId; this.scrollY = e.clientY;
      try { this.c.setPointerCapture(e.pointerId); } catch (x) { /* ignorieren */ }
      return;
    }
    if (this.pid != null) return;
    e.preventDefault();
    try { this.c.setPointerCapture(e.pointerId); } catch (x) { /* ignorieren */ }
    this.pid = e.pointerId; if (e.pointerType === 'pen') penActive = true;
    setActivePad(this);
    const p = this.pos(e);
    this.snapshot();
    if (S.pen.tool === 'eraser') { this.erasing = true; this.eraseAt(p); return; }
    this.cur = { c: S.pen.color, w: S.pen.width, p: [p] };
    this.b.strokes.push(this.cur);
    drawStroke(this.ctx, this.cur);
  }
  onMove(e) {
    if (e.pointerId === this.scrollPid) { const dy = this.scrollY - e.clientY; this.scrollY = e.clientY; window.scrollBy(0, dy); return; }
    if (e.pointerId !== this.pid) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = this.pos(ev);
      if (this.erasing) { this.eraseAt(p); continue; }
      const pts = this.cur.p, last = pts[pts.length - 1];
      if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 0.8) continue;
      pts.push(p);
      this.ctx.strokeStyle = this.cur.c; this.ctx.lineCap = 'round';
      drawSeg(this.ctx, this.cur, pts.length - 1);
      if (p[1] > this.b.h - 70) { this.b.h += INK_GROW_STEP; this.layout(); }
    }
  }
  onUp(e) {
    if (e.pointerId === this.scrollPid) { this.scrollPid = null; return; }
    if (e.pointerId !== this.pid) return;
    this.pid = null; penActive = false;
    if (this.cur) { this.cur = null; this.redraw(); }
    if (this.erasing) { this.erasing = false; if (this.hist.length && this.hist[this.hist.length - 1] === JSON.stringify(this.b.strokes)) this.hist.pop(); }
    touch();
  }
  eraseAt(p) {
    const r = 16, r2 = r * r; const before = this.b.strokes.length;
    this.b.strokes = this.b.strokes.filter(s => !s.p.some(q => (q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2 < r2));
    if (this.b.strokes.length !== before) this.redraw();
  }
}
function setActivePad(p) {
  if (activePad === p) return;
  activePad?.card.classList.remove('active-ink');
  activePad = p; p.card.classList.add('active-ink');
}

/* Handschrift als Bild für den Bericht */
function inkToDataURL(b, px = 900) {
  const maxY = b.strokes.reduce((m, s) => Math.max(m, ...s.p.map(q => q[1] + s.w * 2)), 0);
  if (!b.strokes.length) return null;
  const minY = b.strokes.reduce((m, s) => Math.min(m, ...s.p.map(q => q[1] - s.w * 2)), Infinity);
  const top = Math.max(0, minY - 20), bottom = Math.min(b.h, maxY + 20);
  const sc = px / INK_LOGICAL_WIDTH;
  const c = document.createElement('canvas'); c.width = px; c.height = Math.max(40, Math.round((bottom - top) * sc));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#FCFDFB'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.setTransform(sc, 0, 0, sc, 0, -top * sc);
  b.strokes.forEach(s => drawStroke(ctx, s));
  return c.toDataURL('image/png');
}

const blobToDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
async function dataURLToBlob(u) { const r = await fetch(u); return r.blob(); }
function canShareFiles() { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } }

async function buildBackup(inspIds) {
  await flushSave();
  const allInsp = await DB.all('inspections');
  const insps = inspIds ? allInsp.filter(i => inspIds.includes(i.id)) : allInsp;
  const folderIds = new Set(insps.map(i => i.folderId));
  const folders = (await DB.all('folders')).filter(f => !inspIds || folderIds.has(f.id));
  const media = [];
  for (const i of insps) for (const b of i.blocks) if (b.type === 'photo') {
    const m = await DB.get('media', b.mediaId);
    if (m) media.push({ id: m.id, w: m.w, h: m.h, type: m.type, created: m.created, data: await blobToDataURL(m.blob) });
  }
  return { format: 'begehungsmappe', version: 1, app: APP_VERSION, exported: new Date().toISOString(), folders, inspections: insps, media };
}
async function backupFile(inspId) {
  const data = await buildBackup(inspId ? [inspId] : null);
  let name = 'Begehungsmappe_Sicherung_' + todayISO();
  if (inspId) { const i = data.inspections[0]; name = 'Begehung_' + fileSafe(i.title) + '_' + i.date; }
  return new File([JSON.stringify(data)], name + '.json', { type: 'application/json' });
}
function download(file) {
  const u = URL.createObjectURL(file); const a = document.createElement('a');
  a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
  toast('Sicherung „' + file.name + '“ wird gespeichert');
}
async function share(file) {
  try { await navigator.share({ files: [file], title: file.name }); }
  catch (e) { if (e.name !== 'AbortError') { toast('Teilen nicht möglich, Datei wird stattdessen gespeichert'); download(file); } }
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.format !== 'begehungsmappe') throw new Error('Das ist keine Sicherung der Begehungsmappe.');
    for (const m of data.media || []) await DB.put('media', { id: m.id, w: m.w, h: m.h, type: m.type, created: m.created, blob: await dataURLToBlob(m.data) });
    for (const f of data.folders || []) await DB.put('folders', f);
    for (const i of data.inspections || []) await DB.put('inspections', i);
    toast(`Eingelesen: ${(data.folders || []).length} Ordner, ${(data.inspections || []).length} Begehungen`, 4000);
    requestPersist();
    render();
  } catch (e) { toast('Einlesen fehlgeschlagen: ' + e.message, 5000); }
}

    case 'askDelFolder': S.confirmKey = 'f:' + id; render(); break;
    case 'delFolder': {
      for (const i of await DB.byFolder(id)) await deleteInspection(i);
      await DB.del('folders', id); S.confirmKey = null; toast('Ordner gelöscht'); render(); break;
    }
    case 'toggleNewInsp': S.showNewInsp = !S.showNewInsp; render(); break;
    case 'openInsp': S.insp = null; nav('editor', { inspId: id }); break;
    case 'openReport': await flushSave(); nav('report', { inspId: id }); break;
    case 'askDelInsp': S.confirmKey = 'i:' + id; render(); break;
    case 'delInsp': { const i = await DB.get('inspections', id); if (i) await deleteInspection(i); S.confirmKey = null; toast('Begehung gelöscht'); render(); break; }
    case 'exportInsp': download(await backupFile(id)); break;
    case 'exportAll': download(await backupFile(null)); break;
    case 'shareAll': share(await backupFile(null)); break;
    case 'import': $('#impIn').click(); break;
    case 'backToFolder': { const fid = S.insp?.folderId; nav('folder', { folderId: fid }); break; }
    case 'backToEditor': history.length > 1 && history.state?.view === 'report' ? history.back() : nav('editor', { inspId: S.inspId }); break;
    case 'print': try { window.print(); } catch (x) { toast('Drucken ist hier nicht verfügbar'); } break;
    case 'toggleMeta': S.showMeta = !S.showMeta; render(); break;
    case 'setInsert': S.insertAt = +el.dataset.at; render(); break;
    case 'camera': $('#camIn').click(); break;
    case 'gallery': $('#galIn').click(); break;
    case 'addInk': { const b = insertBlock(newInk()); S.lastAdded = b.id; render(); break; }
    case 'addText': { const b = insertBlock(newText()); S.lastAdded = b.id; render(); break; }
    case 'inkMore': pads.find(p => p.b.id === id)?.grow(); break;
    case 'cyclePrio': {
      const b = S.insp.blocks.find(x => x.id === id);
      b.prio = PRIO_ORDER[(PRIO_ORDER.indexOf(b.prio || '') + 1) % PRIO_ORDER.length];
      el.className = 'chip chip-btn ' + b.prio; el.textContent = PRIO[b.prio];
      el.closest('.blk').className = el.closest('.blk').className.replace(/prio-\S+/, 'prio-' + (b.prio || 'none'));
      touch(); break;
    }
    case 'moveUp': case 'moveDown': {
      const bl = S.insp.blocks, i = bl.findIndex(x => x.id === id), j = act === 'moveUp' ? i - 1 : i + 1;
      if (j < 0 || j >= bl.length) break;
      [bl[i], bl[j]] = [bl[j], bl[i]]; touch(); render(); break;
    }
    case 'askDelBlock': S.confirmKey = 'b:' + id; render(); break;
    case 'delBlock': {
      const bl = S.insp.blocks, i = bl.findIndex(x => x.id === id); const b = bl[i];
      bl.splice(i, 1);
      if (S.insertAt != null && S.insertAt > i) S.insertAt--;
      if (b.type === 'photo') await DB.del('media', b.mediaId);
      S.confirmKey = null; touch(); await flushSave(); render(); break;
    }
    case 'penColor': S.pen.color = el.dataset.color; S.pen.tool = 'pen'; store.set('pen', S.pen); refreshDock(); break;
    case 'penWidth': S.pen.width = +el.dataset.w; S.pen.tool = 'pen'; store.set('pen', S.pen); refreshDock(); break;
    case 'eraser': S.pen.tool = S.pen.tool === 'eraser' ? 'pen' : 'eraser'; store.set('pen', S.pen); refreshDock(); break;
    case 'undo': if (activePad) activePad.undo(); else toast('Erst auf eine Handschrift-Fläche schreiben'); break;
    case 'finger': S.fingerDraws = !S.fingerDraws; store.set('fingerDraws', S.fingerDraws); refreshDock(); toast(S.fingerDraws ? 'Finger zeichnet jetzt auf den Flächen' : 'Finger scrollt, nur der Stift zeichnet'); break;
  }
});
function refreshDock() { const d = $('.dock'); if (d) d.outerHTML = dockHTML(); }

async function deleteInspection(i) {
  for (const b of i.blocks) if (b.type === 'photo') await DB.del('media', b.mediaId);
  await DB.del('inspections', i.id);
  if (S.insp?.id === i.id) S.insp = null;
}

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'newFolder') {
    const name = $('#newFolderName').value.trim();
    if (!name) { toast('Bitte einen Namen für den Ordner eingeben'); return; }
    await DB.put('folders', { id: uid(), name, created: Date.now() });
    requestPersist(); toast('Ordner „' + name + '“ angelegt'); render();
  } else if (f.dataset.form === 'rename') {
    const name = $('#rn-' + f.dataset.id).value.trim(); if (!name) return;
    const fo = await DB.get('folders', f.dataset.id); fo.name = name; await DB.put('folders', fo);
    S.renameId = null; render();
  } else if (f.dataset.form === 'newInsp') {
    const insp = newInspection(S.folderId, { title: $('#niTitle').value.trim() || 'Begehung', date: $('#niDate').value || todayISO(), art: $('#niArt').value, objekt: $('#niObj').value.trim(), teilnehmer: $('#niTeil').value.trim() });
    await DB.put('inspections', insp); requestPersist();
    S.insp = insp; nav('editor', { inspId: insp.id });
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.classList.contains('txt')) { const b = S.insp.blocks.find(x => x.id === t.dataset.id); if (b) { b.text = t.value; autoGrow(t); touch(); } }
  else if (t.id === 'inspTitle') { S.insp.title = t.value; touch(); }
  else if (t.dataset && t.dataset.meta && S.insp) {
    S.insp[t.dataset.meta] = t.value; touch();
    if (t.dataset.meta === 'art') { const sg = $('.bar .sign'); if (sg) sg.outerHTML = signHTML(t.value, true); }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'autoNote') { S.autoNote = t.value; store.set('autoNote', S.autoNote); }
  else if (t.id === 'camIn' || t.id === 'galIn') { const files = Array.from(t.files || []); t.value = ''; addPhotos(files); }
  else if (t.id === 'impIn') { const f = t.files && t.files[0]; t.value = ''; if (f) importBackup(f); }
});
document.addEventListener('focusin', (e) => {
  // Antippen eines Textfelds setzt die Einfügemarke dahinter, damit Fotos dort landen
  const blk = e.target.closest && e.target.closest('.blk');
  if (blk && S.insp && e.target.classList.contains('txt')) {
    const i = S.insp.blocks.findIndex(x => x.id === blk.dataset.id);
    if (i >= 0 && S.insertAt !== i + 1) { S.insertAt = i + 1; markGap(); }
  }
});
document.addEventListener('pointerdown', (e) => {
  const blk = e.target.closest && e.target.closest('.blk[data-type="ink"]');
  if (blk && S.insp && e.target.tagName === 'CANVAS') {
    const i = S.insp.blocks.findIndex(x => x.id === blk.dataset.id);
    if (i >= 0 && S.insertAt !== i + 1) { S.insertAt = i + 1; markGap(); }
  }
}, true);
function markGap() {
  const n = S.insp.blocks.length;
  $$('.gap').forEach(g => { const at = +g.dataset.at; const on = at === S.insertAt; g.classList.toggle('on', on); g.textContent = on ? (at === n ? 'Einfügemarke · Ende' : 'Einfügemarke') : 'Hier einfügen'; });
}

/* ======================================================================
   Start
   ====================================================================== */
(async function start() {
  await initDB();
  try { history.replaceState({ view: 'home' }, ''); } catch (e) { /* ignorieren */ }
  render(true);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      await navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) toast('Neue Version installiert. Beim nächsten Öffnen aktiv.', 4000); });
    } catch (e) { /* Vorschau ohne Service Worker */ }
  }
})();
})();
</script>
</body>
